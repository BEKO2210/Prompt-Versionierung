<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Prompt Tree — versioning, branching, testing, refinement OS for prompts. Runs entirely in your browser." />
  <title>Prompt Tree</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="apple-touch-icon" href="./assets/favicon.svg" />
  <meta name="theme-color" content="#0f1120" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <!-- Live region for status messages -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal mount point -->
  <div id="modal-root"></div>

  <!-- Command palette mount point -->
  <div id="palette-root"></div>

  <!-- Drawer mount point (right-side slide-in) -->
  <div id="drawer-root"></div>

  <!-- App mount point -->
  <main id="app" class="app"></main>

  <!-- Loading splash, removed by main.js -->
  <div id="splash">
    <img class="splash-mark" src="./assets/mark.svg" width="40" height="40" alt="Prompt Tree" />
    <div class="splash-text">Prompt Tree</div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
