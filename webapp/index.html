<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Prompt Tree — the offline-first, git-style OS for prompts. Versioned, peer-reviewed, evaluated, shippable. Runs entirely in your browser." />
  <title>Prompt Tree — Branch. Prove. Ship.</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="apple-touch-icon" href="./assets/favicon.svg" />
  <meta name="theme-color" content="#0b1220" />

  <!-- OpenGraph / Twitter / WhatsApp / Telegram / Discord / Slack preview.
       Crawlers don't execute JS, so these are the only cues they get.
       Absolute URLs because Facebook-family crawlers refuse relative
       og:image. If you fork + redeploy, swap the host below. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Prompt Tree" />
  <meta property="og:title" content="Prompt Tree — Branch. Prove. Ship." />
  <meta property="og:description" content="The offline-first, git-style OS for prompts. Versioned, peer-reviewed, evaluated, shippable. Runs entirely in your browser." />
  <meta property="og:url" content="https://beko2210.github.io/Prompt-Versionierung/" />
  <meta property="og:image" content="https://beko2210.github.io/Prompt-Versionierung/assets/og-card.png" />
  <meta property="og:image:secure_url" content="https://beko2210.github.io/Prompt-Versionierung/assets/og-card.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Prompt Tree — Branch. Prove. Ship." />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Prompt Tree — Branch. Prove. Ship." />
  <meta name="twitter:description" content="The offline-first, git-style OS for prompts. Versioned, peer-reviewed, evaluated, shippable." />
  <meta name="twitter:image" content="https://beko2210.github.io/Prompt-Versionierung/assets/og-card.png" />
  <meta name="twitter:image:alt" content="Prompt Tree — Branch. Prove. Ship." />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <!-- Live region for status messages -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal mount point -->
  <div id="modal-root"></div>

  <!-- Command palette mount point -->
  <div id="palette-root"></div>

  <!-- Drawer mount point (right-side slide-in) -->
  <div id="drawer-root"></div>

  <!-- App mount point -->
  <main id="app" class="app"></main>

  <!-- Loading splash, removed by main.js -->
  <div id="splash">
    <img class="splash-mark" src="./assets/mark.svg" width="40" height="40" alt="Prompt Tree" />
    <div class="splash-text">Prompt Tree</div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
