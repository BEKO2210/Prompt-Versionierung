<?xml version="1.0" encoding="UTF-8"?>
<!--
  Prompt Tree wordmark — colored mark + text lockup. Use this in
  marketing surfaces (README headers, social cards). Height is
  exactly 32; width scales proportionally. Text uses system-ui so it
  matches the app without bundling a font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" role="img" aria-label="Prompt Tree">
  <title>Prompt Tree</title>
  <defs>
    <linearGradient id="wm-ink" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Mark at left -->
  <g transform="translate(0 4) scale(1.333)" fill="none" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-8 12 12)">
      <path d="M 6 20
               C 6 16, 12 15.2, 12 11.2
               C 12 8.0, 15.8 6.8, 17 5.2"
            stroke="url(#wm-ink)"/>
      <path d="M 12 11.2 C 15.4 12.4, 18.2 13.6, 19.6 15.2"
            stroke="#a855f7" stroke-width="1.5"
            stroke-dasharray="2 2.2" opacity="0.82"/>
      <circle cx="6"    cy="20"   r="1.7"  stroke="url(#wm-ink)" fill="#ffffff"/>
      <circle cx="12"   cy="11.2" r="1.35" fill="url(#wm-ink)" stroke="none"/>
      <circle cx="17"   cy="5.2"  r="2.1"  fill="url(#wm-ink)" stroke="none"/>
      <circle cx="17"   cy="5.2"  r="3.2"  stroke="url(#wm-ink)" stroke-width="1.1" opacity="0.35"/>
      <circle cx="19.6" cy="15.2" r="1.3"  stroke="#a855f7" stroke-width="1.3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="44" y="21" fill="#15182b"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" letter-spacing="-0.3">Prompt Tree</text>
</svg>
