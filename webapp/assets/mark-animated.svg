<?xml version="1.0" encoding="UTF-8"?>
<!--
  Prompt Tree — animated mark
  ───────────────────────────
  Same geometry as mark.svg (three-node sigil, φ-proportions, −8° rotation),
  but with a one-shot draw-in on load plus a gentle perpetual head pulse.

  The spline is drawn by animating stroke-dashoffset from full length to 0
  (standard line-drawing trick). Each node fades in at the moment the main
  spline reaches it. After ~2.5s the whole mark is rendered; thereafter
  only the head's outer ring breathes (opacity 0.35 ↔ 0.55 on a 2.6s cycle)
  so the mark feels alive without being distracting on repeated views.

  Pure SMIL — works inline on GitHub / Pages / any static host. No JS.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Prompt Tree">
  <title>Prompt Tree</title>
  <defs>
    <linearGradient id="pt-ink" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1"    stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-8 12 12)" fill="none" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Main spline: seed → fork → head. ~15 unit path length. -->
    <path id="pt-main"
          d="M 6 20 C 6 16, 12 15.2, 12 11.2 C 12 8.0, 15.8 6.8, 17 5.2"
          stroke="url(#pt-ink)"
          stroke-dasharray="18" stroke-dashoffset="18">
      <animate attributeName="stroke-dashoffset"
               from="18" to="0"
               begin="0.15s" dur="1.6s" fill="freeze"/>
    </path>

    <!-- Refinement side-branch: dashed, leaves the fork, draws AFTER the
         main spline has passed the fork. -->
    <path id="pt-refine"
          d="M 12 11.2 C 15.4 12.4, 18.2 13.6, 19.6 15.2"
          stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2.2"
          opacity="0">
      <animate attributeName="opacity"
               from="0" to="0.82"
               begin="1.1s" dur="0.6s" fill="freeze"/>
    </path>

    <!-- Seed: open circle. Appears at t=0. -->
    <circle cx="6" cy="20" r="1.7" stroke="url(#pt-ink)" fill="#ffffff" opacity="0">
      <animate attributeName="opacity"
               from="0" to="1"
               begin="0s" dur="0.3s" fill="freeze"/>
    </circle>

    <!-- Fork: solid dot. Appears when the main spline reaches it (~t=0.9s). -->
    <circle cx="12" cy="11.2" r="1.35" fill="url(#pt-ink)" opacity="0">
      <animate attributeName="opacity"
               from="0" to="1"
               begin="0.9s" dur="0.3s" fill="freeze"/>
    </circle>

    <!-- Refinement tip: open node at the end of the dashed branch. -->
    <circle cx="19.6" cy="15.2" r="1.3"
            stroke="#a855f7" stroke-width="1.3" fill="#ffffff" opacity="0">
      <animate attributeName="opacity"
               from="0" to="1"
               begin="1.6s" dur="0.3s" fill="freeze"/>
    </circle>

    <!-- Canonical head: filled disk. Appears when the main spline completes. -->
    <circle cx="17" cy="5.2" r="2.1" fill="url(#pt-ink)" opacity="0">
      <animate attributeName="opacity"
               from="0" to="1"
               begin="1.7s" dur="0.3s" fill="freeze"/>
    </circle>

    <!-- Crown ring around the head — this is the only element that keeps
         breathing after the draw-in finishes. Subtle 2.6s cycle. -->
    <circle cx="17" cy="5.2" r="3.2"
            stroke="url(#pt-ink)" stroke-width="1.1" opacity="0">
      <animate attributeName="opacity"
               from="0" to="0.45"
               begin="1.9s" dur="0.4s" fill="freeze"/>
      <animate attributeName="opacity"
               values="0.55; 0.35; 0.55"
               keyTimes="0; 0.5; 1"
               begin="2.4s" dur="2.6s" repeatCount="indefinite"
               calcMode="spline"
               keySplines="0.4 0 0.6 1 ; 0.4 0 0.6 1"/>
    </circle>

  </g>
</svg>
