<?xml version="1.0" encoding="UTF-8"?>
<!--
  Prompt Tree mark
  ─────────────────
  Three nodes — seed, fork, head — joined by a single continuous spline.
  The path from seed to head never breaks (immutability). A dashed side
  branch leaves the fork and ends in an open node (refinement, not
  canonical). φ-proportional: fork at 61.8 %, head at 38.2 %.
  Stroke width is exactly 1/12 of the viewBox so the mark stays legible
  from 16 px to 512 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Prompt Tree">
  <title>Prompt Tree</title>
  <defs>
    <linearGradient id="pt-ink" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-8 12 12)" fill="none" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Main spline: seed → fork → head. A single <path> so the line is
         literally unbroken. -->
    <path d="M 6 20
             C 6 16, 12 15.2, 12 11.2
             C 12 8.0, 15.8 6.8, 17 5.2"
          stroke="url(#pt-ink)"/>

    <!-- Refinement side-branch: dashed, leaving the fork, ending in an
         open node (intentionally NOT canonical). Teal-variant so the
         whole mark stays in the ocean palette (CLAUDE.md §1.1). -->
    <path d="M 12 11.2 C 15.4 12.4, 18.2 13.6, 19.6 15.2"
          stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="2 2.2" opacity="0.82"/>

    <!-- Seed: open circle (no fill) — the start of the story -->
    <circle cx="6" cy="20" r="1.7" stroke="url(#pt-ink)" fill="#ffffff"/>

    <!-- Fork: small solid dot -->
    <circle cx="12" cy="11.2" r="1.35" fill="url(#pt-ink)" stroke="none"/>

    <!-- Canonical head: larger filled disk + a thin ring (implied crown) -->
    <circle cx="17" cy="5.2" r="2.1" fill="url(#pt-ink)" stroke="none"/>
    <circle cx="17" cy="5.2" r="3.2" stroke="url(#pt-ink)" stroke-width="1.1" opacity="0.35"/>

    <!-- Refinement tip: open node (teal-variant, same palette as the dash). -->
    <circle cx="19.6" cy="15.2" r="1.3" stroke="#67e8f9" stroke-width="1.3" fill="#ffffff"/>
  </g>
</svg>
