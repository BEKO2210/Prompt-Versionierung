<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon variant — 16 px optimised. Drops the refinement side-branch
  and the implied-crown ring; keeps the three primary nodes + the main
  spline. Sits on a rounded 24×24 tile so it reads as a product icon,
  not a free-floating line in the browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1120"/>
      <stop offset="1" stop-color="#0a1820"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#bg)"/>
  <g transform="rotate(-8 12 12)" fill="none" stroke="#67e8f9" stroke-width="1.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 7 18.5
             C 7 15, 12 14.3, 12 11
             C 12 8, 15.2 7, 16.5 5.8"/>
    <circle cx="7"    cy="18.5" r="1.5" fill="#0f1120"/>
    <circle cx="12"   cy="11"   r="1.2" fill="#67e8f9"/>
    <circle cx="16.5" cy="5.8"  r="1.9" fill="#67e8f9"/>
  </g>
</svg>
