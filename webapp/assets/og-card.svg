<?xml version="1.0" encoding="UTF-8"?>
<!--
  Prompt Tree — OpenGraph card (1200 × 630)
  ─────────────────────────────────────────
  Static brand-first composition for link previews on WhatsApp, Reddit,
  Twitter/X, Telegram, LinkedIn, Slack, Discord, etc.

  Crawlers do not run JS and typically freeze animated assets to the
  first frame, so this file is a STATIC end-state — no SMIL, no JS.
  Layout is a centred vertical stack so WhatsApp's narrow thumbnail
  crop still shows the brand + tagline legibly.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Prompt Tree — Branch. Prove. Ship.">
  <title>Prompt Tree — Branch. Prove. Ship.</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0b1220"/>
      <stop offset="1"    stop-color="#0e2a3a"/>
    </linearGradient>
    <linearGradient id="og-ink" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#155e75"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1"    stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="og-title" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#67e8f9"/>
      <stop offset="1"    stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Soft top-right watermark sigil -->
  <g transform="translate(880 -90) scale(18)" opacity="0.08">
    <g transform="rotate(-8 12 12)" fill="none" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 20 C 6 16, 12 15.2, 12 11.2 C 12 8.0, 15.8 6.8, 17 5.2" stroke="url(#og-ink)"/>
      <circle cx="6" cy="20" r="1.7" stroke="url(#og-ink)" fill="#0b1220"/>
      <circle cx="12" cy="11.2" r="1.35" fill="url(#og-ink)"/>
      <circle cx="17" cy="5.2" r="2.1" fill="url(#og-ink)"/>
      <circle cx="17" cy="5.2" r="3.2" stroke="url(#og-ink)" stroke-width="1.1" opacity="0.4"/>
    </g>
  </g>

  <!-- Centred brand sigil — larger than the watermark, the hero glyph -->
  <g transform="translate(516 62) scale(7)">
    <g transform="rotate(-8 12 12)" fill="none" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 20 C 6 16, 12 15.2, 12 11.2 C 12 8.0, 15.8 6.8, 17 5.2" stroke="url(#og-ink)"/>
      <path d="M 12 11.2 C 15.4 12.4, 18.2 13.6, 19.6 15.2"
            stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="2 2.2" opacity="0.82"/>
      <circle cx="6" cy="20" r="1.7" stroke="url(#og-ink)" fill="#ffffff"/>
      <circle cx="12" cy="11.2" r="1.35" fill="url(#og-ink)"/>
      <circle cx="17" cy="5.2" r="2.1" fill="url(#og-ink)"/>
      <circle cx="17" cy="5.2" r="3.2" stroke="url(#og-ink)" stroke-width="1.1" opacity="0.45"/>
      <circle cx="19.6" cy="15.2" r="1.3" stroke="#67e8f9" stroke-width="1.3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Big title, centred -->
  <text x="600" y="340" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="112" font-weight="800" fill="url(#og-title)" letter-spacing="-0.03em">Prompt Tree</text>

  <!-- Tagline, centred -->
  <text x="600" y="390" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="600" fill="#22d3ee" letter-spacing="0.24em">BRANCH.   PROVE.   SHIP.</text>

  <!-- Pitch, centred -->
  <text x="600" y="448" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="500" fill="#e2e8f0" letter-spacing="-0.01em">The offline-first, git-style OS for prompts.</text>
  <text x="600" y="482" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" font-weight="400" fill="#94a3b8">Versioned. Peer-reviewed. Evaluated. Shippable.</text>

  <!-- Feature strip along the bottom — three short proof-points -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g transform="translate(80 548)">
      <text font-size="16" font-weight="600" fill="#67e8f9" letter-spacing="0.1em">IMMUTABLE</text>
      <text y="26" font-size="14" fill="#94a3b8">body, parent, hash write-once</text>
    </g>
    <g transform="translate(600 548)" text-anchor="middle">
      <text font-size="16" font-weight="600" fill="#67e8f9" letter-spacing="0.1em">BROWSER-ONLY</text>
      <text y="26" font-size="14" fill="#94a3b8">no backend, no lock-in</text>
    </g>
    <g transform="translate(1120 548)" text-anchor="end">
      <text font-size="16" font-weight="600" fill="#67e8f9" letter-spacing="0.1em">A/B WITH PROOF</text>
      <text y="26" font-size="14" fill="#94a3b8">Wilson · Newcombe · blame · trend</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="600" y="612" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.1em">BEKO2210.GITHUB.IO/PROMPT-VERSIONIERUNG</text>
</svg>
